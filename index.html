<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fanta Formazione</title>
<meta name="theme-color" content="#7a1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fanta">
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="icona-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#f3f1ec;--card:#ffffff;--ink:#1d1a16;--muted:#6f6a62;--line:#e6e1d8;--soft:#f7f5f0;
  --brand:#8f1424;--brand2:#c8202f;--gold:#c99a3a;--accent:#8f1424;
  --ok:#1d8a4a;--warn:#c47a00;--bad:#c4323f;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
  --nav-h:64px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111014;--card:#1b1a20;--ink:#f1ede6;--muted:#a39d93;--line:#2c2a31;--soft:#232129;
  --accent:#e0485a;--shadow:none;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px)}
button,input,select{font:inherit;color:inherit}
.hidden{display:none!important}

/* ---------- testata ---------- */
.top{position:relative;z-index:20;background:linear-gradient(180deg,#5c0b16,#8f1424);color:#fff;
  padding:calc(env(safe-area-inset-top) + 10px) 16px 12px;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.top-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px}
.top img{width:48px;height:48px;object-fit:contain;flex:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.top h1{margin:0;font-size:19px;letter-spacing:.2px}
.top .sub{font-size:12.5px;opacity:.85;margin-top:1px}
.top .who{margin-left:auto;font-size:12px;opacity:.85;text-align:right;display:none}

/* ---------- layout ---------- */
.wrap{max-width:1100px;margin:0 auto;padding:12px 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0;box-shadow:var(--shadow)}
.card h2{margin:0 0 10px;font-size:16px}
.card h3{margin:14px 0 6px;font-size:14px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.note{color:var(--muted);font-size:12.5px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.big{font-size:30px;font-weight:800;line-height:1.05}
.grid2{display:grid;gap:12px}
@media (min-width:980px){
  .grid2{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:start}
  .grid2>div>.card:first-child{margin-top:0}
}

/* ---------- nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:11px;color:var(--muted);padding:4px 0;cursor:pointer;border-radius:10px}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--accent);font-weight:700}
@media (min-width:980px){
  body{padding-bottom:24px}
  .nav{position:sticky;top:76px;bottom:auto;max-width:1100px;margin:12px auto 0;border:1px solid var(--line);border-radius:14px;
    justify-content:flex-start;gap:4px;padding:6px}
  .nav button{flex:none;flex-direction:row;gap:8px;font-size:14px;padding:8px 14px}
  .nav button.on{background:var(--soft)}
  .nav button svg{width:20px;height:20px}
  .top .who{display:block}
  .top{position:sticky;top:0}
}

/* ---------- squadre ---------- */
.teams{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.teams::-webkit-scrollbar{display:none}
.team{flex:0 0 auto;display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:var(--card);
  border-radius:14px;padding:8px 14px 8px 8px;cursor:pointer;text-align:left;min-width:200px}
.team.on{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 15%,transparent)}
.team b{display:block;font-size:14.5px}
.team small{display:block;color:var(--muted);font-size:11.5px}
.crest{width:42px;height:42px;flex:none;object-fit:contain}
.team.add{min-width:0;padding:8px 14px;color:var(--muted);font-weight:600;border-style:dashed}

/* ---------- badge ruoli ---------- */
.badge{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:7px;color:#fff;
  font-size:11px;font-weight:800;flex:none}
.P{background:linear-gradient(145deg,#ffc23d,#e08a00)}.D{background:linear-gradient(145deg,#45c96a,#1f8a3d)}
.C{background:linear-gradient(145deg,#5a8fff,#2152c9)}.A{background:linear-gradient(145deg,#ff5a6b,#c0202f)}
.hi{color:var(--ok)}.mid{color:var(--warn)}.lo{color:var(--bad)}

/* ---------- campo ---------- */
.pitch{position:relative;overflow:hidden;border-radius:18px;padding:14px 4px;color:#fff;
  background:repeating-linear-gradient(180deg,#2f9152 0 46px,#2a8549 46px 92px)}
.pitch::before{content:"";position:absolute;inset:10px;border:2px solid rgba(255,255,255,.35);border-radius:6px;pointer-events:none}
.pitch::after{content:"";position:absolute;left:50%;bottom:10px;width:46%;height:64px;transform:translateX(-50%);
  border:2px solid rgba(255,255,255,.35);border-bottom:none;pointer-events:none}
.line{position:relative;z-index:1;display:flex;justify-content:center;gap:2px;margin:12px 0}
.pl{display:flex;flex-direction:column;align-items:center;flex:0 1 96px;min-width:0;text-align:center;font-size:11px;
  cursor:pointer;border:0;background:none;color:#fff;padding:0}
.shirt{position:relative;width:46px;height:46px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35))}
.shirt svg{width:46px;height:46px}
.shirt .badge{position:absolute;right:-6px;bottom:-2px;width:18px;height:18px;font-size:10px;border-radius:6px}
.pl b{display:block;margin-top:4px;max-width:100%;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:rgba(0,0,0,.5);padding:1px 6px;border-radius:6px}
.pl span{opacity:.92;margin-top:1px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .pct{display:inline-block;margin-top:2px;padding:0 6px;border-radius:999px;font-size:11px;font-weight:700;background:rgba(255,255,255,.92)}
@media (min-width:600px){.shirt,.shirt svg{width:54px;height:54px}.pl{font-size:12px}.pl b{font-size:13px}}

/* ---------- liste ---------- */
.list>div,.li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.list>div:last-child,.li:last-child{border-bottom:0}
.li .info{flex:1;min-width:0}
.li .info b{font-size:14.5px}
.li .info small{display:block;color:var(--muted);font-size:12px;line-height:1.35}
.li .n{color:var(--muted);width:18px;text-align:right;font-size:13px;flex:none}
.li .pct{font-weight:700;font-size:14px;white-space:nowrap}
.mini{width:28px;height:28px;flex:none}
.mini svg{width:28px;height:28px}
.li.tap{cursor:pointer}
.tag{font-size:10.5px;padding:1px 6px;border-radius:6px;background:var(--soft);border:1px solid var(--line);color:var(--muted);margin-left:4px;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--muted)}
.chip.best{border-color:var(--ok);color:var(--ok);font-weight:700}
.alert{border-radius:12px;padding:10px 12px;font-size:13.5px;margin:10px 0}
.alert.warn{background:color-mix(in srgb,var(--warn) 13%,transparent);color:var(--warn)}
.alert.ok{background:color-mix(in srgb,var(--ok) 13%,transparent);color:var(--ok)}
.alert.bad{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}

/* ---------- form ---------- */
label.f{display:block;margin:10px 0}
label.f span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px;font-weight:600}
input[type=text],input[type=email],input[type=password],input[type=number],select{width:100%;padding:12px;border:1px solid var(--line);
  border-radius:12px;background:var(--soft);font-size:16px}
input:focus,select:focus{outline:2px solid color-mix(in srgb,var(--accent) 50%,transparent);border-color:transparent}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);
  border-radius:12px;padding:11px 14px;font-weight:600;cursor:pointer;font-size:15px}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.full{width:100%}
.btn.sm{padding:7px 10px;font-size:13px;border-radius:10px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.55}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btns .btn{flex:1}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0}
.switch input{width:46px;height:28px;appearance:none;background:var(--line);border-radius:999px;position:relative;cursor:pointer;flex:none}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch input:checked{background:var(--ok)}
.switch input:checked::after{left:21px}
.seg{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}

/* ---------- login ---------- */
.auth{max-width:420px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 28px) 18px 30px;text-align:center}
.auth img{width:150px;height:150px;object-fit:contain;filter:drop-shadow(0 4px 10px rgba(0,0,0,.25))}
.auth h1{margin:8px 0 2px;font-size:24px}
.auth .card{text-align:left}

/* ---------- foglio dal basso ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;
  padding:16px 16px calc(18px + env(safe-area-inset-bottom));animation:up .18s ease-out}
@media (min-width:600px){.sheet-bg{align-items:center}.sheet{border-radius:20px}}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet h2{margin:0 0 4px;font-size:18px}
.opts{display:grid;gap:8px;margin-top:12px}
.opts button{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;cursor:pointer;font-weight:600}
.opts button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.opts button small{display:block;font-weight:400;color:var(--muted);font-size:12px}

/* ---------- mercato ---------- */
.swap{display:flex;align-items:center;gap:6px;margin:10px 0}
.swap .side{flex:1;min-width:0;border-radius:12px;padding:8px;display:flex;align-items:center;gap:8px}
.swap .out{background:color-mix(in srgb,var(--bad) 9%,transparent)}
.swap .in{background:color-mix(in srgb,var(--ok) 11%,transparent)}
.swap .side b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.swap .side small{display:block;font-size:11.5px;color:var(--muted)}
.swap .arr{color:var(--muted);font-size:18px;flex:none}
.plan{border:2px solid var(--line);border-radius:16px;padding:12px;margin:12px 0}
.plan.best{border-color:color-mix(in srgb,var(--ok) 55%,transparent)}
.plan h3{margin:0 0 2px;text-transform:none;letter-spacing:0;color:var(--ink);font-size:16px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.kpi{background:var(--soft);border-radius:12px;padding:8px;text-align:center}
.kpi b{display:block;font-size:20px}.kpi span{font-size:11px;color:var(--muted)}
.drop{border:2px dashed var(--line);border-radius:14px;padding:18px;text-align:center;cursor:pointer;color:var(--muted)}
.drop b{color:var(--ink);display:block;font-size:15px;margin-bottom:2px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.thumbs img{width:54px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t td,table.t th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
table.t th{color:var(--muted);font-weight:600;font-size:12px}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 24px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:#1d1a16;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.3);max-width:90vw}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:24px 10px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
</style>
</head>
<body>
<div id="app"><div class="empty" style="padding-top:40vh"><span class="spin"></span></div></div>
<div id="sheet"></div>
<div id="toast" class="toast hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
"use strict";
/* =====================================================================
   Fanta Formazione · app web (GitHub Pages) con account Supabase
   ===================================================================== */
const SUPABASE_URL = "https://ijtviwtbylrybaeqzdep.supabase.co";
const SUPABASE_KEY = "sb_publishable_ykS0UURcT3DhFxVQukVcJA_i_UB0Xub";
const SQUADRE_A = ["Atalanta","Bologna","Cagliari","Como","Fiorentina","Frosinone","Genoa","Inter","Juventus","Lazio","Lecce",
  "Milan","Monza","Napoli","Parma","Roma","Sassuolo","Torino","Udinese","Venezia"];
const RUOLI = ["P","D","C","A"], ROLE_ORDER = {P:0,D:1,C:2,A:3};
const NOME_RUOLO = {P:"Portieri",D:"Difensori",C:"Centrocampisti",A:"Attaccanti"};
const RUOLO1 = {P:"Portiere",D:"Difensore",C:"Centrocampista",A:"Attaccante"};
const MODULI_DEF = ["3-4-3","3-5-2","4-3-3","4-4-2","4-5-1","5-3-2","5-4-1"];
const TABMOD_DEF = [{da:6.0,punti:1},{da:6.5,punti:3},{da:7.0,punti:6}];
const REGOLE_DEF = {tipo:"buste",crediti:0,max_svincoli:3,max_acquisti:3,rimborso:"quotazione",stesso_ruolo:true,riserva:0,note:""};

let sb = null;
const S = {user:null, giornata:{}, squadre:[], stato:{}, view:"formazione", cur:null, merc:null, imgs:[]};

/* ---------------- utilità ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},
               set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function toast(msg, ms=2600){const t=$("#toast");t.textContent=msg;t.classList.remove("hidden");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.add("hidden"),ms);}
const cls = p => p>=0.75?"hi":p>=0.45?"mid":"lo";
const odd = v => {v=Math.max(1,Math.round(v));return v%2?v:v+1;};
function normName(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z]/g,"");}

/* ---------------- maglie e stemmi ---------------- */
const KIT={Lazio:['#8fd0f0','#ffffff','p'],Inter:['#0a5fb4','#111111','s'],Napoli:['#1aa3e0','#ffffff','p'],
  Juventus:['#ffffff','#111111','s'],Milan:['#d0102c','#111111','s'],Roma:['#8e1f2f','#f0bc42','p'],
  Atalanta:['#1e71b8','#111111','s'],Fiorentina:['#5b2a86','#ffffff','p'],Torino:['#8a1e03','#ffffff','p'],
  Bologna:['#1a2f48','#a21c26','s'],Udinese:['#ffffff','#111111','s'],Como:['#1b4d9c','#ffffff','p'],
  Cagliari:['#a6192e','#002350','h'],Parma:['#ffffff','#111111','b'],Sassuolo:['#00a752','#111111','s'],
  Genoa:['#a6192e','#002350','h'],Venezia:['#1a1a1a','#f26522','b'],Lecce:['#ffd100','#d50032','s'],
  Frosinone:['#ffd100','#0055a4','p'],Monza:['#d50032','#ffffff','b']};
let kitId=0;
function shirt(team){
  const [a,b,s]=KIT[team]||['#cfd6e4','#8a93a6','p'];const id='k'+(kitId++);
  const body='M14 6 L22 3 Q24 6 26 6 Q28 6 30 3 L38 6 L46 14 L40 21 L36 18 L36 44 L12 44 L12 18 L8 21 L2 14 Z';
  let fill=a,defs='';
  if(s==='s'){defs=`<pattern id="${id}" width="8" height="48" patternUnits="userSpaceOnUse"><rect width="8" height="48" fill="${a}"/><rect x="4" width="4" height="48" fill="${b}"/></pattern>`;fill=`url(#${id})`;}
  if(s==='h'){defs=`<linearGradient id="${id}"><stop offset=".5" stop-color="${a}"/><stop offset=".5" stop-color="${b}"/></linearGradient>`;fill=`url(#${id})`;}
  const band=s==='b'?`<path d="M12 22 L36 22 L36 28 L12 28 Z" fill="${b}"/><path d="M21 6 L27 6 L27 44 L21 44 Z" fill="${b}" opacity="${team==='Parma'?1:0}"/>`:'';
  const trim=s==='p'?b:'rgba(0,0,0,.25)';
  return `<svg viewBox="0 0 48 48" aria-hidden="true"><defs>${defs}<clipPath id="c${id}"><path d="${body}"/></clipPath></defs>
    <path d="${body}" fill="${fill}"/><g clip-path="url(#c${id})">${band}<path d="M0 0 H48 V20 H0Z" fill="rgba(255,255,255,.12)"/></g>
    <path d="${body}" fill="none" stroke="rgba(0,0,0,.35)" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M22 3 Q24 8 26 8 Q28 8 30 3" fill="none" stroke="${trim}" stroke-width="2"/></svg>`;
}
function crest(sq){
  const d=sq.dati;
  if(d.stemma==='desperados' || /desperados/i.test(d.squadra||'')) return `<img class="crest" src="logo.png" alt="">`;
  const c=d.modificatore?['#1b3fa8','#3a7bff','#ffd23f']:['#7a1020','#d6283b','#ffd23f'];
  const init=(d.squadra||'?').replace(/^I\s+/,'').slice(0,1).toUpperCase();
  return `<svg class="crest" viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="cr${esc(sq.id)}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c[1]}"/><stop offset="1" stop-color="${c[0]}"/></linearGradient></defs>
    <path d="M20 2 L36 7 V19 C36 29 29 35 20 38 C11 35 4 29 4 19 V7 Z" fill="url(#cr${esc(sq.id)})" stroke="${c[2]}" stroke-width="2"/>
    <text x="20" y="25" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" font-family="-apple-system,Segoe UI,sans-serif">${esc(init)}</text></svg>`;
}
const ICON={
  formazione:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 12h18M12 3v18"/><circle cx="12" cy="12" r="3"/></svg>',
  rosa:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 4l4-1 4 1 4 3-2 4-2-1v10H8V10l-2 1-2-4z"/></svg>',
  mercato:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 7h11l-3-3M17 17H6l3 3"/></svg>',
  notizie:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>',
  account:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>'
};

/* =====================================================================
   MOTORE: stessa logica della pagina Fanta Formazione
   ===================================================================== */
const CAP={P:40,D:60,C:120,A:200};
const BASE={D:{g:0.07,a:0.08,y:0.22},C:{g:0.30,a:0.25,y:0.18},A:{g:0.65,a:0.20,y:0.12}};
const partita = pl => (S.giornata.partite||{})[pl.t] || {diff:3,casa:false};
const quality = pl => Math.max(0,Math.min(1,Math.log(1+(pl.fvm||1))/Math.log(1+CAP[pl.r])));
function voto(pl,m){m=m||partita(pl);return 6+quality(pl)*0.35+(3-m.diff)*0.12+(m.casa?0.05:-0.03);}
function attF(pl,m){m=m||partita(pl);return Math.max(0.5,1+(3-m.diff)*0.18)*(m.casa?1.08:0.95);}
function xBonus(pl,m){
  if(pl.r==='P')return {g:0,a:0,y:0};
  const b=BASE[pl.r],q=quality(pl),lvl=0.15+0.85*Math.pow(q,1.5),f=attF(pl,m),K=6;
  let g=b.g*lvl,a=b.a*lvl;const st=pl.st;
  if(st&&st.pr>0){g=((st.g-(st.gr||0))+g*K)/(st.pr+K);a=(st.a+a*K)/(st.pr+K);}
  return {g:(g+0.2*(pl.rig||0))*f,a:a*f,y:b.y};
}
function bonusP(pl){const x=xBonus(pl);return pl.r==='P'?0:1-Math.exp(-(x.g+x.a));}
function fanta(pl,m){
  m=m||partita(pl);const v=voto(pl,m);
  if(pl.r==='P'){const ga=0.45+0.3*m.diff;return v-ga+Math.exp(-ga);}
  const x=xBonus(pl,m);return v+3*x.g+x.a-0.5*x.y;
}
const score = pl => pl.p/100*fanta(pl);
function normCdf(x){const t=1/(1+0.2316419*Math.abs(x));const d=0.3989423*Math.exp(-x*x/2);const p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return x>0?1-p:p;}
function modBonus(mod,gk,defs){
  if(!mod||defs.length<4||!gk)return 0;
  const best=[...defs].sort((a,b)=>voto(b)-voto(a)).slice(0,3),players=[gk,...best];
  const mean=players.reduce((s,p)=>s+voto(p),0)/4,sd=0.38,tab=S.giornata.tabella_modificatore||TABMOD_DEF;
  let exp=0;
  for(let i=0;i<tab.length;i++){const lo=tab[i].da,hi=i+1<tab.length?tab[i+1].da:99;exp+=(normCdf((hi-mean)/sd)-normCdf((lo-mean)/sd))*tab[i].punti;}
  return exp*Math.pow(players.reduce((s,p)=>s*Math.max(p.p/100,0.3),1),0.5);
}
function migliore(rosa,mod){
  const by={P:[],D:[],C:[],A:[]};rosa.forEach(p=>by[p.r]&&by[p.r].push(p));
  for(const r in by)by[r].sort((a,b)=>score(b)-score(a));
  const res=(S.giornata.moduli||MODULI_DEF).map(m=>{
    const [d,c,a]=m.split('-').map(Number);
    if(!by.P.length||by.D.length<d||by.C.length<c||by.A.length<a)return null;
    const gk=by.P[0],D=by.D.slice(0,d),C=by.C.slice(0,c),A=by.A.slice(0,a);
    const base=[gk,...D,...C,...A].reduce((s,p)=>s+score(p),0),mb=modBonus(mod,gk,D);
    return {m,gk,D,C,A,base,mb,tot:base+mb};
  }).filter(Boolean).sort((x,y)=>y.tot-x.tot);
  if(!res.length)return null;
  const win=res[0],used=new Set([win.gk,...win.D,...win.C,...win.A]);
  const bench=rosa.filter(p=>!used.has(p)).sort((a,b)=>(ROLE_ORDER[a.r]-ROLE_ORDER[b.r])||(score(b)-score(a)));
  return {res,win,bench};
}
const kPl = pl => pl.n+'|'+pl.t;
function overrides(){const o=S.stato.override||{};return o.giornata===S.giornata.giornata?(o.p||{}):{};}
function arricchisci(sq){
  const gioc=S.giornata.giocatori||{},ov=overrides();
  return (sq.dati.rosa||[]).map(pl=>{
    const info=gioc[kPl(pl)];
    const x={...pl,fvm:Number(pl.fvm)||1,notizie:!!info,p:info?(info.p??50):50,
      nota:info?(info.nota||''):'Nessuna notizia per questa giornata: toccalo per dire tu se gioca'};
    if(info&&info.st)x.st=info.st; if(info&&info.rig!=null)x.rig=info.rig;
    const ok=sq.id+'|'+kPl(pl); if(ov[ok]!=null){x.p=ov[ok];x.manuale=true;}
    return x;
  });
}
const matchTxt = pl => {const m=(S.giornata.partite||{})[pl.t];return m?(m.casa?'vs ':'@ ')+m.vs:'';};

async function carica(){
  const [g,sq,st]=await Promise.all([
    sb.from('fanta_giornata').select('dati').eq('id',1).maybeSingle(),
    sb.from('fanta_squadre').select('id,dati,membri,aggiornato').order('id'),
    sb.from('fanta_stato').select('dati').eq('user_id',S.user.id).maybeSingle()
  ]);
  if(g.error||sq.error)throw (g.error||sq.error);
  S.giornata=(g.data&&g.data.dati)||{};
  S.squadre=(sq.data||[]).map(r=>({...r,dati:r.dati||{}}));
  S.stato=(st.data&&st.data.dati)||{};
  const pref=store.get('ff-cur');
  S.cur=(S.squadre.find(s=>s.id===pref)||S.squadre[0]||{}).id||null;
}
async function salvaSquadra(sq){
  const {error}=await sb.from('fanta_squadre').update({dati:sq.dati,membri:sq.membri,aggiornato:new Date().toISOString()}).eq('id',sq.id);
  if(error){toast('Non salvato: '+error.message);throw error;}
}
async function salvaStato(){
  const {error}=await sb.from('fanta_stato').upsert({user_id:S.user.id,dati:S.stato,aggiornato:new Date().toISOString()});
  if(error)toast('Non salvato: '+error.message);
}
const curSq = () => S.squadre.find(s=>s.id===S.cur);

function renderAuth(mode){
  mode=mode||'entra';
  $('#app').innerHTML=`<div class="auth">
    <img src="logo.png" alt="">
    <h1>Fanta Formazione</h1>
    <div class="note">La formazione migliore per le tue leghe, ogni giornata.</div>
    <div class="card" style="margin-top:18px">
      <div class="seg" id="aseg"><button data-m="entra" class="${mode==='entra'?'on':''}">Entra</button><button data-m="nuovo" class="${mode==='nuovo'?'on':''}">Crea account</button></div>
      <form id="af">
        ${mode==='nuovo'?`<label class="f"><span>Il tuo nome</span><input type="text" id="an" autocomplete="given-name" required></label>`:''}
        <label class="f"><span>Email</span><input type="email" id="ae" autocomplete="email" required></label>
        <label class="f"><span>Password${mode==='nuovo'?' (almeno 6 caratteri)':''}</span><input type="password" id="ap" autocomplete="${mode==='nuovo'?'new-password':'current-password'}" required minlength="6"></label>
        <button class="btn pri full" id="ab" type="submit">${mode==='nuovo'?'Crea account':'Entra'}</button>
      </form>
      <div id="amsg"></div>
      ${mode==='entra'?`<div style="text-align:center;margin-top:10px"><button class="btn sm" id="areset" type="button">Ho dimenticato la password</button></div>`:''}
    </div></div>`;
  document.querySelectorAll('#aseg button').forEach(b=>b.onclick=()=>renderAuth(b.dataset.m));
  const msg=(t,k)=>{$('#amsg').innerHTML=`<div class="alert ${k||'bad'}">${esc(t)}</div>`;};
  $('#af').onsubmit=async e=>{
    e.preventDefault();const b=$('#ab');b.disabled=true;b.innerHTML='<span class="spin"></span>';
    const email=$('#ae').value.trim(),pw=$('#ap').value;
    try{
      if(mode==='nuovo'){
        const nome=$('#an').value.trim();
        const {data,error}=await sb.auth.signUp({email,password:pw,options:{data:{nome},emailRedirectTo:location.origin+location.pathname}});
        if(error)throw error;
        if(!data.session){msg("Account creato! Ti è arrivata un'email: apri il link di conferma, poi torna qui ed entra.","ok");b.disabled=false;b.textContent='Crea account';return;}
      }else{
        const {error}=await sb.auth.signInWithPassword({email,password:pw});
        if(error)throw error;
      }
    }catch(err){
      const m=String(err.message||err);
      msg(/confirm/i.test(m)?"Devi prima confermare l'email: apri il link che ti è arrivato.":
          /registered|exists/i.test(m)?"Esiste già un account con questa email: usa «Entra».":
          /invalid/i.test(m)?"Email o password sbagliate.":"Errore: "+m);
      b.disabled=false;b.textContent=mode==='nuovo'?'Crea account':'Entra';
    }
  };
  const r=$('#areset');
  if(r)r.onclick=async()=>{
    const email=$('#ae').value.trim();if(!email){msg('Scrivi prima la tua email qui sopra.');return;}
    const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
    msg(error?'Errore: '+error.message:"Ti ho mandato un'email per scegliere una nuova password.",error?'bad':'ok');
  };
}

function plCard(pl){
  const pp=pl.p/100;
  return `<button class="pl" data-k="${esc(kPl(pl))}"><div class="shirt">${shirt(pl.t)}<span class="badge ${pl.r}">${pl.r}</span></div>
    <b>${esc(pl.n)}</b><span>${esc(matchTxt(pl))}</span><span class="pct ${cls(pp)}">${Math.round(pl.p)}%${pl.manuale?' ✋':''}</span></button>`;
}
function liPl(pl,i){
  const pp=pl.p/100;
  return `<div class="li tap" data-k="${esc(kPl(pl))}">${i!=null?`<span class="n">${i}</span>`:''}<span class="mini">${shirt(pl.t)}</span><span class="badge ${pl.r}">${pl.r}</span>
    <div class="info"><b>${esc(pl.n)}</b>${pl.manuale?'<span class="tag">scelto da te</span>':''}${!pl.notizie&&!pl.manuale?'<span class="tag">senza notizie</span>':''}
    <small>${esc(pl.t)} ${esc(matchTxt(pl))}${pl.r!=='P'&&pl.p>0?` · bonus ${Math.round(bonusP(pl)*100)}%`:''}</small>
    <small>${esc(pl.nota)}</small></div><span class="pct ${cls(pp)}">${Math.round(pl.p)}%</span></div>`;
}
function vFormazione(v){
  const sq=curSq();if(!sq)return nessunaSquadra(v);
  const rosa=arricchisci(sq),r=migliore(rosa,sq.dati.modificatore);
  if(!r){v.innerHTML=`${teamBar(true)}<div class="card empty"><b>Rosa incompleta</b>Servono almeno 1 portiere, 3 difensori, 3 centrocampisti e 1 attaccante. Completala nella scheda Rosa.</div>`;bindTeamBar();return;}
  const {res,win,bench}=r,tit=[win.gk,...win.D,...win.C,...win.A];
  const dubbi=tit.filter(p=>p.p<70),assenti=rosa.filter(p=>p.p===0),senza=rosa.filter(p=>!p.notizie&&!p.manuale);
  v.innerHTML=`${teamBar(true)}
  <div class="grid2"><div>
    <div class="card"><div class="row"><div class="grow"><div class="note">Modulo consigliato</div><div class="big">${win.m}</div></div>
      <div style="text-align:right"><div class="note">Punteggio atteso</div><div class="big">${win.tot.toFixed(1)}</div>
      <div class="note">${sq.dati.modificatore?`modificatore ≈ +${win.mb.toFixed(1)}`:'senza modificatore'}</div></div></div>
      <div class="chips">${res.map((x,i)=>`<span class="chip ${i===0?'best':''}">${x.m} · ${x.tot.toFixed(1)}</span>`).join('')}</div>
      ${senza.length?`<div class="alert warn">${senza.length} giocatori senza notizie per questa giornata: li conto al 50%. Toccali per dire tu se giocano.</div>`:''}
    </div>
    <div class="pitch">${[win.A,win.C,win.D,[win.gk]].map(l=>`<div class="line">${l.map(plCard).join('')}</div>`).join('')}</div>
    <div class="note" style="margin:8px 4px">Tocca un giocatore per vedere le notizie o cambiare la sua probabilità di giocare.</div>
  </div><div>
    ${dubbi.length?`<div class="card"><h2>Da ricontrollare</h2><div>${dubbi.map(p=>liPl(p)).join('')}</div></div>`:''}
    <div class="card"><h2>Panchina, in ordine</h2><div>${bench.map((p,i)=>liPl(p,i+1)).join('')}</div></div>
    ${assenti.length?`<div class="card"><h2>Assenti</h2><div>${assenti.map(p=>liPl(p)).join('')}</div></div>`:''}
  </div></div>`;
  bindTeamBar();
  v.querySelectorAll('[data-k]').forEach(el=>el.onclick=()=>sheetGiocatore(sq,rosa.find(p=>kPl(p)===el.dataset.k)));
}
function sheetGiocatore(sq,pl){

  const st=pl.st;
  openSheet(`<div class="row"><span class="mini" style="width:40px;height:40px">${shirt(pl.t)}</span><div class="grow"><h2>${esc(pl.n)}</h2>
    <div class="note">${RUOLO1[pl.r]} · ${esc(pl.t)} ${esc(matchTxt(pl))} ${esc(((S.giornata.partite||{})[pl.t]||{}).quando||'')}</div></div>

    ${st?`<div class="note">Stagione: ${st.g} gol${st.gr?` (${st.gr} su rigore)`:''}, ${st.a} assist in ${st.pr} partite${(pl.rig||0)>=0.5?' · rigorista':''}</div>`:''}

    <div class="btns">${ov[k]!=null?`<button class="btn" id="ovr">Torna alle notizie</button>`:''}<button class="btn" id="ovc">Chiudi</button></div>`);

    <div class="card"><h2>Lega</h2>
      <label class="f"><span>Nome della lega</span><input type="text" id="ln" value="${esc(d.nome||'')}"></label>
      <label class="f"><span>Nome della tua squadra</span><input type="text" id="ls" value="${esc(d.squadra||'')}"></label>
      <div class="switch"><div><b>Modificatore difesa</b><div class="note">Accendilo se la lega dà bonus per la media di portiere e difensori</div></div><input type="checkbox" id="lm" ${d.modificatore?'checked':''}></div>

function giornateGiocate(){return Math.max(1,(Number(S.giornata.giornata)||2)-1);}
// valore atteso a giornata (resto della stagione): disponibilità × fantavoto atteso in una partita media
function valuta(pl,inRosa){
  const neutro={diff:3,casa:false};
  const x={...pl,fvm:Number(pl.fvm)||Math.max(1,(Number(pl.qt)||1)*1.6)};
  const info=(S.giornata.giocatori||{})[kPl(pl)];
  if(info&&info.st)x.st=info.st; if(info&&info.rig!=null)x.rig=info.rig;
  let est=fanta(x,neutro);
  const fm=Number(pl.fm),pv=Number(pl.pv);
  if(fm>0&&pv>=2)est=(fm*pv+est*4)/(pv+4);
  // disponibilità nel resto della stagione: qualità del giocatore (chi è forte gioca quando sta bene),
  // presenze finora e notizie di questa settimana (pesano meno: gli infortuni brevi passano)
  const G=giornateGiocate(),prior=0.35+0.6*quality(x);
  const pr=x.st?x.st.pr:(pv>0?pv:null),pres=pr!=null?Math.min(1,pr/G):prior,now=info?(info.p??50)/100:prior;
  let disp=0.4*prior+0.35*pres+0.25*now;
  if(info&&/stagione finita|crociato|fuori rosa|ceduto/i.test(info.nota||''))disp=0.02;
  return {disp,est,val:disp*est,nota:info?info.nota:''};
}
function rimborso(pl,reg){
  const q=Number(pl.qt);if(!(q>=0)||pl.qt==null)return null;
  return reg.rimborso==='quotazione'?q:reg.rimborso==='meta'?Math.floor(q/2):0;
}
function prezzo(c,rankFrac,reg){
  const q=Math.max(1,Number(c.qt)||1);
  if(reg.tipo==='libero')return q;
  return odd(q*(1.1+0.45*rankFrac)); // buste: più è forte, più rilancio
}
function calcolaMercato(sq){
  const d=sq.dati,reg={...REGOLE_DEF,...(d.regole||{})},sv=d.svincolati||[];
  const rosa=(d.rosa||[]).map(p=>({...p,...valuta(p,true)}));
  const nomiRosa=new Set((d.rosa||[]).map(p=>normName(p.n)+'|'+p.t));
  const cand=sv.filter(c=>c.n&&c.t&&c.r&&!nomiRosa.has(normName(c.n)+'|'+c.t)).map(c=>({...c,...valuta(c,false)}));
  // rango per ruolo, per decidere quanto rilanciare
  RUOLI.forEach(r=>{const l=cand.filter(c=>c.r===r).sort((a,b)=>b.val-a.val);l.forEach((c,i)=>{c.rank=l.length>1?1-i/(l.length-1):1;});});
  cand.forEach(c=>{c.costo=prezzo(c,c.rank||0,reg);});
  const pairs=[];
  rosa.forEach(o=>cand.forEach(c=>{
    if(reg.stesso_ruolo&&o.r!==c.r)return;
    const gain=c.val-o.val;if(gain<=0.05)return;
    pairs.push({out:o,inn:c,gain,rimb:rimborso(o,reg)??0,costo:c.costo});
  }));
  pairs.sort((a,b)=>b.gain-a.gain);
  const top=pairs.slice(0,22),K=Math.max(0,Math.min(Number(reg.max_svincoli)||0,Number(reg.max_acquisti)||0));
  const budget=(Number(reg.crediti)||0)-(Number(reg.riserva)||0);
  const piani=[];
  (function rec(start,chosen,usedO,usedI){
    if(chosen.length){
      const spesa=chosen.reduce((s,x)=>s+x.costo,0),rim=chosen.reduce((s,x)=>s+x.rimb,0);
      if(spesa<=budget+rim)piani.push({sc:[...chosen],gain:chosen.reduce((s,x)=>s+x.gain,0),spesa,rim,resto:(Number(reg.crediti)||0)+rim-spesa});
    }
    if(chosen.length>=K)return;
    for(let i=start;i<top.length;i++){const p=top[i];if(usedO.has(p.out)||usedI.has(p.inn))continue;
      usedO.add(p.out);usedI.add(p.inn);chosen.push(p);rec(i+1,chosen,usedO,usedI);chosen.pop();usedO.delete(p.out);usedI.delete(p.inn);}
  })(0,[],new Set(),new Set());
  piani.sort((a,b)=>b.gain-a.gain||a.spesa-b.spesa);
  const best=piani[0]||null;
  let prudente=null;
  if(best){const lim=best.spesa*0.6;prudente=piani.filter(p=>p.spesa<=lim&&p.gain>=best.gain*0.6).sort((a,b)=>b.gain-a.gain)[0]||null;}
  const migliori={};RUOLI.forEach(r=>migliori[r]=cand.filter(c=>c.r===r).sort((a,b)=>b.val-a.val).slice(0,5));
  const senzaQt=(d.rosa||[]).filter(p=>p.qt==null).length;
  return {reg,best,prudente,migliori,nCand:cand.length,senzaQt,K,budget};
}

function comprimi(file){
  return new Promise((ok,ko)=>{const img=new Image();const url=URL.createObjectURL(file);
    img.onload=()=>{const max=1600,s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');
      c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);ok(c.toDataURL('image/jpeg',0.85).split(',')[1]);};
    img.onerror=ko;img.src=url;});
}

    const lista=(data.giocatori||[]).filter(g=>g.n&&SQUADRE_A.includes(g.t)&&RUOLI.includes(g.r));
    if(dove==='rosa'){
      let n=0;(sq.dati.rosa||[]).forEach(p=>{const g=lista.find(x=>normName(x.n)===normName(p.n)&&x.t===p.t)||lista.find(x=>normName(x.n)===normName(p.n));

      const sv=sq.dati.svincolati||(sq.dati.svincolati=[]),key=c=>normName(c.n)+'|'+c.t;const idx=new Map(sv.map((c,i)=>[key(c),i]));
      let nuovi=0;lista.forEach(g=>{const c={n:g.n,t:g.t,r:g.r,qt:g.qt??null,fvm:g.fvm??null,fm:g.fm??null,pv:g.pv??null};

      $('#lmsg').innerHTML=`<div class="alert ok">Letti ${lista.length} giocatori (${nuovi} nuovi). Controlla la lista se serve.</div>`;

    $('#leggi').disabled=$('#leggiRosa').disabled=!S.imgs.length;
  }
}

  if(!g.giornata){v.innerHTML='<div class="card empty"><b>Notizie non ancora disponibili</b></div>';return;}
  const viste=new Set(),righe=[];
  Object.entries(g.partite||{}).forEach(([sq,m])=>{if(viste.has(sq))return;viste.add(sq);viste.add(m.vs);righe.push({q:m.quando||'',c:m.casa?sq:m.vs,o:m.casa?m.vs:sq});});
  const agg=String(g.aggiornato||'').replace(/ · (INVIATA|VERIFICATA|aggiornamento manuale)/g,'');
  v.innerHTML=`<div class="grid2"><div><div class="card"><h2>${g.giornata}ª giornata</h2>
    <div class="note">Notizie aggiornate ${esc(agg)}</div><div class="alert warn">Scadenza: ${esc(g.scadenza||'')}</div>
    ${righe.map(x=>`<div class="li"><span class="mini">${shirt(x.c)}</span><div class="info"><b>${esc(x.c)} – ${esc(x.o)}</b></div><span class="mini">${shirt(x.o)}</span><span class="note" style="width:70px;text-align:right">${esc(x.q)}</span></div>`).join('')}
  </div></div><div><div class="card"><h2>Fonti</h2><div class="note">${esc(g.fonte||'')}</div><div class="note" style="margin-top:8px">${esc(g.statistiche||'')}</div></div></div></div>`;
}
function vAccount(v){
  const nome=(S.user.user_metadata&&S.user.user_metadata.nome)||'';
  v.innerHTML=`<div class="grid2"><div><div class="card"><h2>Il tuo account</h2>
    <div class="li"><div class="info"><b>${esc(nome||S.user.email)}</b><small>${esc(S.user.email)}</small></div></div>
    <label class="f"><span>Nuova password</span><input type="password" id="np" autocomplete="new-password" minlength="6"></label>
    <button class="btn full" id="npb">Cambia password</button>
    <div class="btns"><button class="btn" id="rel">Ricarica i dati</button><button class="btn danger" id="out">Esci</button></div></div></div>
  <div><div class="card"><h2>Mettila sulla schermata Home</h2>
    <div class="note"><b>iPhone</b>: apri questa pagina con Safari, tocca Condividi (il quadrato con la freccia) e scegli «Aggiungi alla schermata Home».<br><br>
    <b>Android</b>: apri con Chrome, tocca il menu ⋮ e scegli «Aggiungi a schermata Home» o «Installa app».</div></div>
    <div class="card"><h2>Come funziona</h2><div class="note">Per ogni giocatore la probabilità di giocare viene da probabili formazioni, infortuni e squalifiche. Il punteggio atteso tiene conto di avversario, casa o trasferta, gol, assist e rigori. L'app prova tutti i moduli e sceglie quello con il punteggio più alto; nelle leghe con modificatore aggiunge il bonus della difesa.</div></div></div></div>`;
  $('#npb').onclick=async()=>{const p=$('#np').value;if(p.length<6){toast('Almeno 6 caratteri');return;}
    const {error}=await sb.auth.updateUser({password:p});toast(error?'Errore: '+error.message:'Password cambiata');$('#np').value='';};
  $('#rel').onclick=async()=>{await carica();toast('Dati aggiornati');shell();};
  $('#out').onclick=async()=>{await sb.auth.signOut();};
}

/* =====================================================================
   AVVIO
   ===================================================================== */
async function avvia(session){
  if(!session){S.user=null;renderAuth();return;}
  if(S.user&&S.user.id===session.user.id)return;
  S.user=session.user;
  try{await carica();}catch(e){$('#app').innerHTML=`<div class="auth"><img src="logo.png" alt=""><div class="alert bad">Non riesco a caricare i dati: ${esc(e.message||e)}</div><button class="btn" onclick="location.reload()">Riprova</button></div>`;return;}
  S.view=store.get('ff-view')||'formazione';
  shell();
}
(function(){
  if(!window.supabase){$('#app').innerHTML='<div class="auth"><img src="logo.png" alt=""><div class="alert bad">Connessione assente: controlla internet e riapri l\'app.</div></div>';return;}
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  sb.auth.onAuthStateChange((ev,session)=>{
    if(ev==='PASSWORD_RECOVERY'){openSheet(`<h2>Nuova password</h2><label class="f"><span>Scegli la nuova password</span><input type="password" id="rp" minlength="6"></label><button class="btn pri full" id="rpb">Salva</button>`);
      $('#rpb').onclick=async()=>{const {error}=await sb.auth.updateUser({password:$('#rp').value});toast(error?'Errore: '+error.message:'Password cambiata');closeSheet();};}
    if(ev==='SIGNED_OUT'){S.user=null;renderAuth();return;}
    if(ev==='INITIAL_SESSION'||ev==='SIGNED_IN')setTimeout(()=>avvia(session),0);
  });
})();
</script>
